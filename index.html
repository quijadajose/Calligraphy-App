<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Calligraphy</title>
    <meta name="description" content="Práctica diaria de caligrafía Palmer y japonesa con lápiz óptico." />
    <meta id="theme-color" name="theme-color" content="#f4efe4" />
    <script>
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('calligraphy-theme'); } catch (e) {}
        var theme = saved === 'dark' || saved === 'light' ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" />
    <!-- Fuentes e íconos van empaquetados con la app: no se pide nada a otros servidores. -->
  </head>
  <body>
    <a class="skip-link" href="#main">Saltar al contenido</a>
    <div id="app">
      <header class="header">
        <div class="logo-area">
          <span class="logo-mark" aria-hidden="true">✒️</span>
          <span class="logo-title">Calligraphy</span>
        </div>
        <nav class="header-menus" aria-label="Navegación principal">
          <button id="menu-lessons" class="menu-trigger is-open" type="button">Hoy</button>
          <button id="menu-progress" class="menu-trigger" type="button">Progreso</button>
        </nav>
        <button id="btn-install" class="b2 install-btn" type="button" hidden><i class="ti ti-download" aria-hidden="true"></i> Instalar</button>
        <button id="menu-settings" class="ib-btn menu-trigger-icon" type="button" aria-label="Ajustes" title="Ajustes"><i class="ti ti-settings" aria-hidden="true"></i></button>
      </header>

      <main id="main" class="main-workspace">
        <section id="course-home" class="course-home">
          <div id="lessons-panel" class="lesson-board">
            <section id="today-panel" class="today-panel" aria-label="Práctica de hoy"></section>
            <div class="board-top">
              <div class="board-tracks" role="group" aria-label="Curso">
                <button id="filter-palmer" class="board-track active" type="button" aria-pressed="true">Palmer</button>
                <button id="filter-kanji" class="board-track" type="button" aria-pressed="false">Japonés</button>
              </div>
              <div id="lesson-tabs" class="board-tabs" role="tablist" aria-label="Grupos"></div>
              <div id="kanji-levels" class="board-levels" role="group" aria-label="Nivel de kanji" hidden></div>
              <h2 id="lesson-heading" class="board-heading"></h2>
              <p id="lesson-blurb" class="board-blurb"></p>
              <input id="lesson-search" class="lesson-search" type="search" placeholder="Buscar carácter, palabra o significado" aria-label="Buscar lección" />
            </div>
            <div class="lesson-grid" id="lesson-list-container"></div>
            <p class="source-credit">Trazos: hanzi-writer-data y <a href="https://kanjivg.tagaini.net/" target="_blank" rel="noreferrer">KanjiVG</a> (CC BY-SA).</p>
          </div>

          <div id="progress-panel" class="lesson-board progress-board" hidden>
            <div class="board-top">
              <h2 class="board-heading">Progreso</h2>
            </div>
            <div id="progress-body" class="progress-body"></div>
          </div>

          <div id="settings-panel" class="lesson-board settings-board" hidden>
            <div class="board-top">
              <h2 class="board-heading">Ajustes</h2>
              <p class="board-blurb">Se guardan solos en este dispositivo y van en el respaldo.</p>
            </div>
            <div id="settings-body" class="settings-body"></div>
          </div>
        </section>

        <!-- Hoja de práctica -->
        <div class="canvas-container" id="canvas-wrapper" data-dock="left" hidden>
          <div class="practice-bar">
            <button class="ib" id="back-home" type="button" aria-label="Volver" title="Volver"><i class="ti ti-chevron-left" aria-hidden="true"></i></button>
            <div class="practice-title-group">
              <span id="practice-glyph-mark" class="practice-glyph-mark"></span>
              <span id="practice-sub-label" class="practice-sub-label"></span>
            </div>
            <div id="stroke-steps" class="chips-row practice-chips" role="group" aria-label="Pasos de la letra" hidden></div>
            <div class="practice-spacer"></div>
            <button class="ib" id="btn-tip" type="button" aria-label="Mostrar indicación" aria-expanded="true" aria-controls="live-tip" title="Indicación"><i class="ti ti-info-circle" aria-hidden="true"></i></button>
            <button class="ib" id="btn-metronome" type="button" aria-label="Metrónomo" aria-pressed="false" title="Metrónomo"><i class="ti ti-metronome" aria-hidden="true"></i></button>
            <button class="ib" id="dictation-btn" type="button" aria-label="Dictado" title="Dictado: escribir de oído" hidden><i class="ti ti-volume" aria-hidden="true"></i></button>
            <button class="ib" id="btn-animate-stroke" type="button" aria-label="Ver cómo se traza" title="Ver cómo se traza"><i class="ti ti-player-play" aria-hidden="true"></i></button>
            <button class="ib" id="zen-mode-btn" type="button" aria-label="Modo inmersivo" title="Modo inmersivo"><i class="ti ti-arrows-maximize" aria-hidden="true"></i></button>
            <button class="go" id="evaluate-btn" type="button">Calificar</button>
          </div>

          <div class="practice-workspace">
            <div class="dock" id="tool-dock" role="toolbar" aria-label="Herramientas" aria-orientation="vertical">
              <button class="ib on" id="tool-fountain" type="button" aria-label="Estilográfica" aria-pressed="true" title="Estilográfica"><i class="ti ti-pencil" aria-hidden="true"></i></button>
              <button class="ib" id="tool-fude" type="button" aria-label="Pincel fude" aria-pressed="false" title="Pincel fude"><i class="ti ti-brush" aria-hidden="true"></i></button>
              <button class="ib" id="tool-pencil" type="button" aria-label="Portaminas" aria-pressed="false" title="Portaminas"><i class="ti ti-writing" aria-hidden="true"></i></button>

              <button class="ib dock-width-btn" id="btn-width-toggle" type="button" aria-label="Cambiar grosor" title="Grosor">
                <span id="dock-width-preview" class="dock-width-preview" aria-hidden="true"></span>
                <span id="dock-width-label" class="dock-width-label">4.0</span>
              </button>

              <label class="ib ink-color-label" title="Color de tinta">
                <span id="dock-color-preview" class="dock-color-preview" aria-hidden="true"></span>
                <input id="ink-color" class="visually-hidden-input" type="color" value="#1a1a1a" aria-label="Color de tinta" />
              </label>

              <div class="sep" aria-hidden="true"></div>

              <button class="ib" id="btn-undo" type="button" aria-label="Deshacer" title="Deshacer (dos dedos)" disabled><i class="ti ti-arrow-back-up" aria-hidden="true"></i></button>
              <button class="ib" id="btn-redo" type="button" aria-label="Rehacer" title="Rehacer (tres dedos)"><i class="ti ti-arrow-forward-up" aria-hidden="true"></i></button>
              <button class="ib" id="tool-eraser" type="button" aria-label="Goma" aria-pressed="false" title="Goma: borra trazos enteros"><i class="ti ti-eraser" aria-hidden="true"></i></button>

              <div class="sep" aria-hidden="true"></div>

              <button class="ib danger" id="btn-clear" type="button" aria-label="Borrar hoja" title="Borrar hoja"><i class="ti ti-trash" aria-hidden="true"></i></button>

              <div class="dock-spacer"></div>

              <div class="pressure-meter-vertical" title="Presión del lápiz" aria-hidden="true">
                <div class="pressure-fill-vertical" id="pressure-indicator"></div>
              </div>
              <span id="pressure-text" class="sr-only">0%</span>
            </div>

            <div class="paper-wrap" id="paper-wrap">
              <div class="tip" id="live-tip" role="status" aria-live="polite">
                <i class="ti ti-info-circle" aria-hidden="true"></i>
                <span id="live-feedback"></span>
                <button id="tip-close" class="tip-close" type="button" aria-label="Ocultar indicación"><i class="ti ti-x" aria-hidden="true"></i></button>
              </div>
              <div id="character-target-container" class="character-target" hidden>
                <div id="guide-char" class="guide-char" hidden></div>
                <div id="kanji-animator-box" class="kanji-animator-box"></div>
              </div>
            </div>
          </div>

          <div id="dictation-overlay" class="dictation-overlay" role="region" aria-label="Dictado" hidden>
            <p id="dictation-prompt">Escucha y escribe.</p>
            <div id="dictation-clock" class="dictation-clock" aria-live="off">0 s</div>
            <div class="dictation-actions">
              <button id="dictation-listen" class="b2" type="button"><i class="ti ti-volume" aria-hidden="true"></i> Repetir</button>
              <button id="dictation-submit" class="go" type="button">Entregar</button>
              <button id="dictation-cancel" class="b2" type="button">Cancelar</button>
            </div>
          </div>

          <button id="zen-exit-btn" class="zen-exit" type="button">✕ Salir del modo inmersivo</button>
        </div>
      </main>

      <!-- Resultado de «Calificar» -->
      <div class="score-modal-backdrop" id="score-modal" hidden>
        <div class="box score-box" role="dialog" aria-modal="true" aria-labelledby="modal-feedback-title" aria-describedby="modal-feedback">
          <div class="score-svg-wrap">
            <svg width="104" height="104" viewBox="0 0 112 112" aria-hidden="true">
              <circle cx="56" cy="56" r="48" class="score-track"></circle>
              <circle id="score-svg-arc" cx="56" cy="56" r="48" class="score-arc" stroke-dasharray="0 302" transform="rotate(-90 56 56)"></circle>
              <text id="modal-score" x="56" y="66" text-anchor="middle" class="score-number">0</text>
            </svg>
          </div>
          <h3 id="modal-feedback-title" class="score-title">Resultado</h3>
          <p id="modal-status" class="score-status"></p>
          <p id="modal-feedback" class="mu score-feedback"></p>
          <ul id="modal-details" class="score-details-list"></ul>
          <div class="modal-actions">
            <button class="b2" id="modal-png-btn" type="button" aria-label="Descargar la hoja como imagen PNG"><i class="ti ti-photo-down" aria-hidden="true"></i> PNG</button>
            <button class="b2" id="modal-retry-btn" type="button">Repetir</button>
            <button class="b2" id="modal-close-btn" type="button" data-autofocus>Seguir en la hoja</button>
            <button class="go" id="modal-next-btn" type="button" hidden>Siguiente</button>
          </div>
        </div>
      </div>

      <!-- Lección por pasos completada -->
      <div id="finish-layer" class="score-modal-backdrop" hidden>
        <canvas id="finish-confetti" class="finish-confetti" aria-hidden="true"></canvas>
        <div class="box finish-box" role="dialog" aria-modal="true" aria-labelledby="finish-title">
          <div class="finish-badge" aria-hidden="true"><i class="ti ti-check"></i></div>
          <h2 id="finish-title" class="finish-title">Lección completada</h2>
          <div class="finish-stats">
            <div class="card">
              <div class="mu">Tiempo</div>
              <div id="finish-time" class="finish-value">0 s</div>
            </div>
            <div class="card">
              <div class="mu">Presión media</div>
              <div id="finish-pressure" class="finish-value">—</div>
            </div>
          </div>
          <div class="modal-actions">
            <button id="finish-stay" class="b2" type="button">Seguir en la hoja</button>
            <button id="finish-home" class="b2" type="button">Inicio</button>
            <button id="finish-next" class="go" type="button" data-autofocus hidden>Siguiente</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
